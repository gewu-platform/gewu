# ===========================================
# 格物 Gewu - 应用配置文件
# ===========================================

spring:
  application:
    name: gewu

  # ==================== 文件上传配置（对齐 native：P4 知识库） ====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
      file-size-threshold: 2MB

  # ==================== 数据库配置 ====================
  # PostgreSQL（业务数据 + 知识库向量）
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/langchain4j_kb
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: GewuKbHikariPool
      max-lifetime: 1800000
      connection-timeout: 30000

  # ==================== Redis（U4：令牌校验/登录限流/配额计数/设置缓存；不可达自动降级） ====================
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: 0
      timeout: 2s
# ==================== LangChain4j 配置 ====================
  # 数据库增量迁移——init.sql 仍是建库真相源，Flyway 只管 V2+ 增量
  # 已有库打基线（baseline-version=1）后应用增量；增量 SQL 必须幂等（IF NOT EXISTS）
  flyway:
    enabled: ${GEWU_FLYWAY_ENABLED:true}
    # 迁移文件在仓库 database/migrations（与 init.sql 同目录，运维一处可见）
    # 相对路径基于进程工作目录；容器内 WORKDIR=/app 且已拷入 database/migrations
    # 需要绝对路径时可覆盖：GEWU_FLYWAY_LOCATIONS=filesystem:/abs/path
    locations: ${GEWU_FLYWAY_LOCATIONS:filesystem:database/migrations}
    baseline-on-migrate: true
    baseline-version: 1
    encoding: UTF-8

langchain4j:
  # 当前激活的模型 ID
  active-model: volc-lite-endpoint

  # 多模型配置
  models:
    # 火山引擎方舟（Coding Plan Lite - 推理接入点）
    # modelName 使用控制台创建的端点 ID
    volc-lite-endpoint:
      provider: volcengine
      baseUrl: https://ark.cn-beijing.volces.com/api/v3
      apiKey: ${VOLC_API_KEY:}
      modelName: ep-20260525141015-h6skp
      temperature: 0.7
      # 能力标记（text=纯文本 / multimodal=支持图片输入）
      # 纯文本模型收到图片时由对话层拦下并给可读提示，而非让模型侧报晦涩错误
      capability: text
      description: "火山 Lite 端点 (ep-h6skp)"

    # 保留兼容配置（供 Day1-7 学习示例使用）

  # Embedding 配置（火山引擎 - 多模态 Doubao-embedding-vision 端点）
  embedding:
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ${VOLC_EMBEDDING_API_KEY:}
    model: ep-20260609173940-d5d4l
    dimension: 2048
    # multimodal: 多模态端点逐条串行 | text: 标准 /embeddings 真批量
    mode: multimodal

# ==================== MyBatis-Plus 配置 ====================
  # P8c: Bing Web Search API (real integration; empty api-key -> graceful degrade notice)
  search:
    api-key: ${BING_SEARCH_API_KEY:}
    endpoint: https://api.bing.microsoft.com/v7.0/search
    count: 5
    timeout-seconds: 15

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*Mapper.xml
  type-aliases-package: com.gewu.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== 服务器配置 ====================

# 可观测性端点（仅暴露 health/metrics/prometheus，其余关闭）
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: gewu

  # health 语义——只反映「服务能否提供能力」
  # Redis 为可选加速层（gewu.redis.enabled 注释：不可达自动降级走 DB/内存路径），
  # 故默认不参与整体健康判定；如需监控 Redis 请走 prometheus 指标或单独探针
  health:
    redis:
      enabled: ${GEWU_HEALTH_REDIS_ENABLED:false}
server:
  port: 8081

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.gewu: DEBUG
  pattern:
    # 日志格式含 traceId（空时显示 -），便于串联单次请求全部日志
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:--}] %-40.40logger{39} : %m%n"
  file:
    name: logs/gewu-web.log
jwt:
  secret: ${JWT_SECRET:mySecretKeyMustBeAtLeast32CharactersLongForHS512Algorithm}
  expiration: ${JWT_EXPIRATION:86400} # 24小时（秒）

# ==================== 自定义安全配置（对齐 native） ====================
security:
  auth:
    throttle:
      enabled: true
      max-attempts: 5
      window-seconds: 300

# ==================== Gewu 自定义配置 ====================
gewu:
  # 接口限流（进程内令牌桶；与 quota 分层——限流管速率，配额管每日总量）
  # 注意：多实例部署时各实例独立计数，全局精确限流需改用 Redis 实现（见 ROADMAP V2.5.0）
  ratelimit:
    enabled: ${GEWU_RATELIMIT_ENABLED:true}
    chat:
      # 对话类接口：突发 10 次，恢复 0.5/秒（≈ 每分钟 30 次）
      capacity: ${GEWU_RATELIMIT_CHAT_CAPACITY:10}
      refill-per-second: ${GEWU_RATELIMIT_CHAT_REFILL:0.5}
    default:
      capacity: ${GEWU_RATELIMIT_DEFAULT_CAPACITY:60}
      refill-per-second: ${GEWU_RATELIMIT_DEFAULT_REFILL:5}
    idle-evict-seconds: ${GEWU_RATELIMIT_IDLE_EVICT_SECONDS:600}
  # 工具执行策略（direct=直执行 / sandbox=沙箱 / disabled=禁用）
  # 注意：策略=sandbox 且沙箱运行时不可用时按 fail-closed 拒绝执行（不静默直执行）
  sandbox:
    policy:
      safe: ${GEWU_SANDBOX_SAFE:direct}
      dynamic: ${GEWU_SANDBOX_DYNAMIC:direct}
      # external 默认改 direct——MCP 工具为纯 HTTP/SSE 直通，本地无代码执行，
      # JVM 隔离无安全收益却带来每次 500ms+ 开销；风险控制改由调用侧有界执行
      # （超时/结果上限/审计留痕）承担
      external: ${GEWU_SANDBOX_EXTERNAL:direct}
      dangerous: ${GEWU_SANDBOX_DANGEROUS:sandbox}
      # 沙箱不可用时降级策略（reject=拒绝[默认] / allow-direct=直执行但强告警）
      on-unavailable: ${GEWU_SANDBOX_ON_UNAVAILABLE:reject}
  # MCP 调用边界（纯 HTTP 直通的真实风险控制点）
  mcp:
    call:
      timeout-ms: ${GEWU_MCP_TIMEOUT_MS:30000}
      max-result-chars: ${GEWU_MCP_MAX_RESULT_CHARS:100000}
  # 沙箱运行器（独立子 JVM 执行；总开关 false 时 sandboxAvailable 恒 false，走 fail-closed）
  runner:
    enabled: ${GEWU_SANDBOX_RUNNER_ENABLED:true}
    timeout-ms: ${GEWU_SANDBOX_TIMEOUT_MS:5000}
    xmx: ${GEWU_SANDBOX_XMX:256m}
  # 公共 Skill 库目录（环境变量 GEWU_SKILLS_DIR 可覆盖）
  skills:
    dir: ${GEWU_SKILLS_DIR:C:\Users\25333\.agents\skills}
  redis:
    # U4：Redis 总开关（false 全走原 DB/内存路径；true 时 Redis 不可达自动降级）
    enabled: ${GEWU_REDIS_ENABLED:true}
  # 文件存储（MinIO，S3 兼容自部署）
  # 说明：endpoint/bucket/凭据供应用直连 MinIO；GEWU_MINIO_PORT(容器9000→宿主)/
  # GEWU_MINIO_CONSOLE_PORT(容器9001→宿主) 是 docker-compose 中 gewu-minio 服务的端口映射，
  # 仅使用 compose 自带 MinIO 时生效；外接 MinIO 时无需配置，直接改 endpoint 即可
  # 统一约定：所有上传文件（知识库文档、对话附件）写入 MinIO，库表仅存 object key/访问链接
  storage:
    endpoint: ${GEWU_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${GEWU_STORAGE_BUCKET:gewu}
    access-key: ${GEWU_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${GEWU_STORAGE_SECRET_KEY:minioadmin}
    # 预签名 URL 的对外端点（浏览器可达）；宿主机直跑留空即可，容器部署设为宿主可达地址
    public-endpoint: ${GEWU_STORAGE_PUBLIC_ENDPOINT:}
