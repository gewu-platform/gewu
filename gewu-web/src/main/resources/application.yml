# ===========================================
# 格物 Gewu - 应用配置文件
# ===========================================

spring:
  application:
    name: gewu

  # ==================== 文件上传配置（对齐 native：P4 知识库） ====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
      file-size-threshold: 2MB

  # ==================== 数据库配置 ====================
  # PostgreSQL（业务数据 + 知识库向量）
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/langchain4j_kb
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: GewuKbHikariPool
      max-lifetime: 1800000
      connection-timeout: 30000

  # ==================== Redis（U4：令牌校验/登录限流/配额计数/设置缓存；不可达自动降级） ====================
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: 0
      timeout: 2s
# ==================== LangChain4j 配置 ====================
langchain4j:
  # 当前激活的模型 ID
  active-model: volc-lite-endpoint

  # 多模型配置
  models:
    # 火山引擎方舟（Coding Plan Lite - 推理接入点）
    # modelName 使用控制台创建的端点 ID
    volc-lite-endpoint:
      provider: volcengine
      baseUrl: https://ark.cn-beijing.volces.com/api/v3
      apiKey: ${VOLC_API_KEY:}
      modelName: ep-20260525141015-h6skp
      temperature: 0.7
      description: "火山 Lite 端点 (ep-h6skp)"

    # 保留兼容配置（供 Day1-7 学习示例使用）

  # Embedding 配置（火山引擎 - 多模态 Doubao-embedding-vision 端点）
  embedding:
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ${VOLC_EMBEDDING_API_KEY:}
    model: ep-20260609173940-d5d4l
    dimension: 2048
    # multimodal: 多模态端点逐条串行 | text: 标准 /embeddings 真批量
    mode: multimodal

# ==================== MyBatis-Plus 配置 ====================
  # P8c: Bing Web Search API (real integration; empty api-key -> graceful degrade notice)
  search:
    api-key: ${BING_SEARCH_API_KEY:}
    endpoint: https://api.bing.microsoft.com/v7.0/search
    count: 5
    timeout-seconds: 15

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*Mapper.xml
  type-aliases-package: com.gewu.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== 服务器配置 ====================
server:
  port: 8081

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.gewu: DEBUG
  file:
    name: logs/gewu-web.log

# ==================== JWT 配置 ====================
jwt:
  secret: ${JWT_SECRET:mySecretKeyMustBeAtLeast32CharactersLongForHS512Algorithm}
  expiration: ${JWT_EXPIRATION:86400} # 24小时（秒）

# ==================== 自定义安全配置（对齐 native） ====================
security:
  auth:
    throttle:
      enabled: true
      max-attempts: 5
      window-seconds: 300

# ==================== Gewu 自定义配置 ====================
gewu:
  redis:
    # U4：Redis 总开关（false 全走原 DB/内存路径；true 时 Redis 不可达自动降级）
    enabled: ${GEWU_REDIS_ENABLED:true}
