# ===========================================
# 格物 Gewu - 应用配置文件
# ===========================================

spring:
  application:
    name: gewu

  # ==================== 文件上传配置（对齐 native：P4 知识库） ====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
      file-size-threshold: 2MB

  # ==================== 数据库配置 ====================
  # PostgreSQL（业务数据 + 知识库向量）
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/langchain4j_kb
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: GewuKbHikariPool
      max-lifetime: 1800000
      connection-timeout: 30000

  # ==================== Redis（U4：令牌校验/登录限流/配额计数/设置缓存；不可达自动降级） ====================
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: 0
      timeout: 2s
# ==================== LangChain4j 配置 ====================
langchain4j:
  # 当前激活的模型 ID
  active-model: volc-lite-endpoint

  # 多模型配置
  models:
    # 火山引擎方舟（Coding Plan Lite - 推理接入点）
    # modelName 使用控制台创建的端点 ID
    volc-lite-endpoint:
      provider: volcengine
      baseUrl: https://ark.cn-beijing.volces.com/api/v3
      apiKey: ${VOLC_API_KEY:}
      modelName: ep-20260525141015-h6skp
      temperature: 0.7
      description: "火山 Lite 端点 (ep-h6skp)"

    # 保留兼容配置（供 Day1-7 学习示例使用）

  # Embedding 配置（火山引擎 - 多模态 Doubao-embedding-vision 端点）
  embedding:
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ${VOLC_EMBEDDING_API_KEY:}
    model: ep-20260609173940-d5d4l
    dimension: 2048
    # multimodal: 多模态端点逐条串行 | text: 标准 /embeddings 真批量
    mode: multimodal

# ==================== MyBatis-Plus 配置 ====================
  # P8c: Bing Web Search API (real integration; empty api-key -> graceful degrade notice)
  search:
    api-key: ${BING_SEARCH_API_KEY:}
    endpoint: https://api.bing.microsoft.com/v7.0/search
    count: 5
    timeout-seconds: 15

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*Mapper.xml
  type-aliases-package: com.gewu.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== 服务器配置 ====================

# V2.2.0 A2：可观测性端点（仅暴露 health/metrics/prometheus，其余关闭）
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: gewu

  # V2.2.0 A2：health 语义——只反映「服务能否提供能力」
  # Redis 为可选加速层（gewu.redis.enabled 注释：不可达自动降级走 DB/内存路径），
  # 故默认不参与整体健康判定；如需监控 Redis 请走 prometheus 指标或单独探针
  health:
    redis:
      enabled: ${GEWU_HEALTH_REDIS_ENABLED:false}
server:
  port: 8081

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.gewu: DEBUG
  pattern:
    # V2.2.0 A2：日志格式含 traceId（空时显示 -），便于串联单次请求全部日志
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:--}] %-40.40logger{39} : %m%n"
  file:
    name: logs/gewu-web.log
jwt:
  secret: ${JWT_SECRET:mySecretKeyMustBeAtLeast32CharactersLongForHS512Algorithm}
  expiration: ${JWT_EXPIRATION:86400} # 24小时（秒）

# ==================== 自定义安全配置（对齐 native） ====================
security:
  auth:
    throttle:
      enabled: true
      max-attempts: 5
      window-seconds: 300

# ==================== Gewu 自定义配置 ====================
gewu:
  # V2.1.0 B1/T1.2：工具执行策略（direct=直执行 / sandbox=沙箱 / disabled=禁用）
  # 注意：策略=sandbox 且沙箱运行时不可用时按 fail-closed 拒绝执行（不静默直执行）
  sandbox:
    policy:
      safe: ${GEWU_SANDBOX_SAFE:direct}
      dynamic: ${GEWU_SANDBOX_DYNAMIC:direct}
      # V2.2.0 A1：external 默认改 direct——MCP 工具为纯 HTTP/SSE 直通，本地无代码执行，
      # JVM 隔离无安全收益却带来每次 500ms+ 开销；风险控制改由调用侧有界执行
      # （超时/结果上限/审计留痕）承担
      external: ${GEWU_SANDBOX_EXTERNAL:direct}
      dangerous: ${GEWU_SANDBOX_DANGEROUS:sandbox}
      # V2.1.0 B4/T4.2：沙箱不可用时降级策略（reject=拒绝[默认] / allow-direct=直执行但强告警）
      on-unavailable: ${GEWU_SANDBOX_ON_UNAVAILABLE:reject}
  # V2.2.0 A1：MCP 调用边界（纯 HTTP 直通的真实风险控制点）
  mcp:
    call:
      timeout-ms: ${GEWU_MCP_TIMEOUT_MS:30000}
      max-result-chars: ${GEWU_MCP_MAX_RESULT_CHARS:100000}
  # V2.1.0 B2：沙箱运行器（独立子 JVM 执行；总开关 false 时 sandboxAvailable 恒 false，走 fail-closed）
  runner:
    enabled: ${GEWU_SANDBOX_RUNNER_ENABLED:true}
    timeout-ms: ${GEWU_SANDBOX_TIMEOUT_MS:5000}
    xmx: ${GEWU_SANDBOX_XMX:256m}
  # V2.0.0 R2/T2.5：公共 Skill 库目录（环境变量 GEWU_SKILLS_DIR 可覆盖）
  skills:
    dir: ${GEWU_SKILLS_DIR:C:\Users\25333\.agents\skills}
  redis:
    # U4：Redis 总开关（false 全走原 DB/内存路径；true 时 Redis 不可达自动降级）
    enabled: ${GEWU_REDIS_ENABLED:true}
