# V2.3.0 B2 评测集：calculator 答案正确性（20 条）
# runner: calculator —— 用例经 CalculatorTool.calculate 真实执行（受限白名单 + Nashorn 引擎）
# 取材说明：calc-001 来自 V2.1.0 冒烟真实样本（1234*5678=7006652）；其余为覆盖
# 四则/幂/括号/科学计数/浮点边界的固定任务。新增用例请保持 id 递增并注明来源。
suite: calculator-basic
runner: calculator
description: 计算器答案正确性（20 条固定任务，确定性可复现）
cases:
  - id: calc-001
    category: arithmetic
    input: "1234*5678"
    expect: { type: exact, value: "7006652" }
  - id: calc-002
    category: arithmetic
    input: "1+1"
    expect: { type: exact, value: "2" }
  - id: calc-003
    category: power
    input: "2^10"
    expect: { type: exact, value: "1024" }
    note: V2.3.0 B1 幂运算缺陷回归（Nashorn 不支持 **，改写 Math.pow）
  - id: calc-004
    category: float
    input: "(100 - 25) * 0.8"
    expect: { type: prefix, value: "60" }
    note: 75*0.8=60.00000000000001 是二进制浮点真相，用前缀断言
  - id: calc-005
    category: arithmetic
    input: "2.5*4"
    expect: { type: exact, value: "10" }
  - id: calc-006
    category: scientific
    input: "1.5e3+2"
    expect: { type: exact, value: "1502" }
  - id: calc-007
    category: arithmetic
    input: "100/4"
    expect: { type: exact, value: "25" }
  - id: calc-008
    category: float
    input: "0.1+0.2"
    expect: { type: prefix, value: "0.3" }
    note: 0.30000000000000004 二进制浮点真相
  - id: calc-009
    category: power
    input: "2^0.5"
    expect: { type: prefix, value: "1.4142" }
  - id: calc-010
    category: arithmetic
    input: "10-3-2"
    expect: { type: exact, value: "5" }
  - id: calc-011
    category: precedence
    input: "3*2^2"
    expect: { type: exact, value: "12" }
    note: ^ 改写为 Math.pow 后为左结合（Excel 语义）
  - id: calc-012
    category: arithmetic
    input: "-5+10"
    expect: { type: exact, value: "5" }
  - id: calc-013
    category: scientific
    input: "1e2"
    expect: { type: exact, value: "100" }
  - id: calc-014
    category: precedence
    input: "(2+3)*(4+5)"
    expect: { type: exact, value: "45" }
  - id: calc-015
    category: float
    input: "100*1.05"
    expect: { type: exact, value: "105" }
  - id: calc-016
    category: power
    input: "2^3^2"
    expect: { type: exact, value: "64" }
    note: 左结合（Math.pow 串行改写），非 JS ** 的右结合——文档化行为
  - id: calc-017
    category: arithmetic
    input: "0-0"
    expect: { type: exact, value: "0" }
  - id: calc-018
    category: arithmetic
    input: "999999*999999"
    expect: { type: exact, value: "999998000001" }
  - id: calc-019
    category: float
    input: "1/3"
    expect: { type: prefix, value: "0.333" }
  - id: calc-020
    category: precedence
    input: "(1+2)*((3+4)*(5+6))"
    expect: { type: exact, value: "231" }
