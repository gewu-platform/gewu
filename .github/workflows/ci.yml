name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (skip tests)
        run: mvn -B -q compile -DskipTests

      - name: Package
        run: mvn -B -q package -DskipTests

      # 依赖漏洞扫描：报告型，不阻断（D5 决策口径：先看见再收紧）
      # continue-on-error 保证报告仍产出并上传；failOnCVSS 仅在报告内容里体现
      - name: Dependency scan (OWASP dependency-check)
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: gewu-backend
          path: '.'
          format: 'HTML'
          args: >-
            --enableExperimental
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/dependency-check-report.*'

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gewu-web
          ref: ${{ github.ref_name }}
          path: gewu-web

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # 检出在子目录，setup-node 默认在工作区根找 lock 文件会直接失败
          cache-dependency-path: gewu-web/package-lock.json

      - name: Install
        working-directory: gewu-web
        run: npm ci

      - name: Build
        working-directory: gewu-web
        run: npm run build

      # V2.5.0 D5：前端依赖漏洞审计（--audit-level=high，首版不阻断，仅报告）
      - name: npm audit
        working-directory: gewu-web
        run: npm audit --audit-level=high || true
