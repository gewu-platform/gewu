# ============================================
# 格物 Gewu — 后端+数据库编排
# 前端不在容器内：宿主机 nginx 托管 dist 并反代 /api（配置见 docs/DEPLOY.md §1.4）
# 用法: cp .env.example .env && docker compose up -d
# ============================================

services:
  gewu-minio:
    image: minio/minio:latest
    # 拉取报 denied（MinIO 已从 Docker Hub 下架社区镜像）时，见 docs/DEPLOY.md FAQ Q10
    container_name: gewu-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${GEWU_STORAGE_ACCESS_KEY:?请在 .env 设置 GEWU_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${GEWU_STORAGE_SECRET_KEY:?请在 .env 设置 GEWU_STORAGE_SECRET_KEY}
    volumes:
      - gewu-minio-data:/data
    ports:
      # API 端口（宿主机映射 19000，避免与常见 9000 冲突）
      - "${GEWU_MINIO_PORT:-19000}:9000"
      # 控制台端口（浏览器管理界面）
      - "${GEWU_MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  gewu-db:
    image: pgvector/pgvector:pg16
    container_name: gewu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GEWU_DB_NAME:-gewu}
      POSTGRES_USER: ${GEWU_DB_USER:-gewu}
      POSTGRES_PASSWORD: ${GEWU_DB_PASSWORD:?请在 .env 设置 GEWU_DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - gewu-db-data:/var/lib/postgresql/data
      # 首次启动自动执行建表（纯表脚本，幂等）
      - ./database/gewu-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${GEWU_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GEWU_DB_USER:-gewu} -d ${GEWU_DB_NAME:-gewu}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  gewu-redis:
    image: redis:7-alpine
    container_name: gewu-redis
    restart: unless-stopped
    # U4：纯缓存用途（令牌校验/限流/配额/设置缓存），不开启持久化
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${GEWU_REDIS_PORT:-16379}:6379"

  gewu-server:
    image: ${GEWU_SERVER_IMAGE:-gewu/gewu-server:latest}
    build:
      context: .
      # U5 双模式：默认 Dockerfile（编译期打包）；预打包 jar 场景在 .env 设 GEWU_SERVER_DOCKERFILE=Dockerfile.jar
      dockerfile: ${GEWU_SERVER_DOCKERFILE:-Dockerfile}
    container_name: gewu-server
    restart: unless-stopped
    depends_on:
      gewu-db:
        condition: service_healthy
      gewu-redis:
        condition: service_healthy
      gewu-minio:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 数据库（覆盖 yml 默认值，指向容器网络内 db）
      SPRING_DATASOURCE_URL: jdbc:postgresql://gewu-db:5432/${GEWU_DB_NAME:-gewu}
      SPRING_DATASOURCE_USERNAME: ${GEWU_DB_USER:-gewu}
      SPRING_DATASOURCE_PASSWORD: ${GEWU_DB_PASSWORD:?请在 .env 设置 GEWU_DB_PASSWORD}
      # Redis（U4：指向容器网络内 gewu-redis）
      SPRING_DATA_REDIS_HOST: gewu-redis
      SPRING_DATA_REDIS_PORT: 6379
      # 文件存储（V2.5.0 M1.1.1：统一 MinIO，库表仅存 object key）
      GEWU_STORAGE_ENDPOINT: http://gewu-minio:9000
      GEWU_STORAGE_PUBLIC_ENDPOINT: ${GEWU_STORAGE_PUBLIC_ENDPOINT:-http://localhost:19000}
      GEWU_STORAGE_BUCKET: ${GEWU_STORAGE_BUCKET:-gewu}
      GEWU_STORAGE_ACCESS_KEY: ${GEWU_STORAGE_ACCESS_KEY:?请在 .env 设置 GEWU_STORAGE_ACCESS_KEY}
      GEWU_STORAGE_SECRET_KEY: ${GEWU_STORAGE_SECRET_KEY:?请在 .env 设置 GEWU_STORAGE_SECRET_KEY}
      # JWT（生产必须改随机值）
      JWT_SECRET: ${GEWU_JWT_SECRET:?请在 .env 设置 GEWU_JWT_SECRET}
      # 模型 Key：T3 seed 依赖——首次启动时导入 llm_provider 表（llm_provider 为空且 yml 缺 key 时对话不可用）
      # .env 的 VOLC_API_KEY 为 seed 数据源；部署后可在网页「设置→模型配置」随时覆盖（写库持久化）
      VOLC_API_KEY: ${VOLC_API_KEY:-}
      # Skill 扫描目录：指向容器内挂载点（宿主机真实目录由 GEWU_SKILLS_DIR_HOST 挂载进来）
      GEWU_SKILLS_DIR: /app/skills
      JAVA_OPTS: ${GEWU_JAVA_OPTS:--Xms512m -Xmx1024m}
    volumes:
      # V2.5.0 M1.1.1：文件本体已改存 MinIO，原 uploads 挂载废弃
      # V2.3.0：迁移文件只读挂载（免重建镜像即可更新增量 SQL；镜像内已内置一份兜底）
      - ./database/migrations:/app/database/migrations:ro
      # 公共 Skill 库：宿主机 skills 目录只读挂载进容器（容器内扫描 /app/skills；
      # 宿主机路径在 .env 的 GEWU_SKILLS_DIR_HOST 配置，Windows/Linux 按部署平台填写）
      - ${GEWU_SKILLS_DIR_HOST:?请在 .env 设置 GEWU_SKILLS_DIR_HOST}:/app/skills:ro
    ports:
      - "${GEWU_SERVER_PORT:-8080}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/chat/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  gewu-db-data:
  gewu-minio-data:
